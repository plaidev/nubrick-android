name: E2E Test
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to checkout'
        required: false
        type: string
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  publish-e2e-app:
    runs-on: ubuntu-latest
    environment:
      name: Only Main
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup jdk
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build e2e app
        run: ./gradlew :e2e:assembleRelease

      - name: Upload e2e app
        run: |
          curl --fail-with-body -L -X POST \
            -F "file=@./e2e/build/outputs/apk/release/e2e-release-unsigned.apk" \
            -H "Authorization: Token ${{ secrets.MAGICPOD_API_TOKEN }}" \
            "https://app.magicpod.com/api/v1.0/Nubrick.app/Nubrick/upload-file/"
